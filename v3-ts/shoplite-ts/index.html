<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ShopLite - TypeScript</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        >
    </head>
    <body>
        <header class="site-header">
            <div class="page-shell header-inner">
                <a class="brand" href="index.html"><h1>ShopLite</h1></a>

                <div class="header-tools">
                    <input
                        id="search-input"
                        class="search-input"
                        type="search"
                        placeholder="Tìm kiếm sản phẩm..."
                        aria-label="Tìm kiếm sản phẩm"
                    >
                    <a class="cart-button" href="cart.html" aria-label="Đi đến giỏ hàng">
                        🛒
                        <span id="cart-badge" class="cart-badge">0</span>
                    </a>
                </div>

                <nav class="site-nav" aria-label="Điều hướng chính">
                    <a class="is-active" href="index.html">Trang chủ</a>
                    <a href="product.html?id=1">Sản phẩm</a>
                    <a href="#">Bộ sưu tập</a>
                    <a href="#">Áo khoác</a>
                    <a href="#">Giày</a>
                    <a href="#">Phụ kiện</a>
                    <a href="cart.html">Giỏ hàng</a>
                </nav>
            </div>
        </header>

        <main class="page-main">
            <section class="page-shell">
                <div class="section-heading">
                    <span class="eyebrow">Bộ sưu tập mới</span>
                    <h2>Sản phẩm nổi bật</h2>
                    <p>Phiên bản ShopLite được xây dựng lại bằng TypeScript.</p>
                </div>
                <section id="product-grid" class="product-grid" aria-label="Danh sách sản phẩm"></section>
            </section>
        </main>

        <footer class="site-footer">
            <div class="page-shell footer-inner">
                <h2>Liên hệ</h2>
                <p>Email: support@shoplite.vn</p>
                <p>Facebook: fb.com/shoplite</p>
                <p>Số điện thoại: 0987 654 321</p>
                <p>&copy; 2026 ShopLite</p>
            </div>
        </footer>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
